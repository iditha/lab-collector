[project]
name = "labcollector"
version = "1.0.0"
description = "Collects lab-run output files into an organized, per-run folder structure."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: PEP 8 style, F: real errors (unused imports, undefined names),
# I: import order, UP: modern Python syntax, B: common bug patterns
select = ["E", "W", "F", "I", "UP", "B"]
